name: PR Preview

on:
  pull_request_target:
    types:
      - closed
  workflow_run:
    workflows:
      - "PR Preview Build"
    types:
      - completed

env:
  CLOUDFLARE_PAGES_PROJECT_NAME: preview-hmcl-docs

concurrency:
  group: pr-preview
  cancel-in-progress: false

jobs:
  remove:
    if: ${{ github.event_name == 'pull_request_target'}}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Generate Removal Notice
        run: |
          echo "Preview already removed" > index.html
      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: |
            pages deploy "." --project-name="${{ env.CLOUDFLARE_PAGES_PROJECT_NAME }}" --branch="pr${{ env.PULL_REQUEST_NUMBER }}" --no-bundle
      - name: Upsert Removal Comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ env.PULL_REQUEST_NUMBER }}" \
            --repo "${{ github.repository }}" \
            --body "Preview already removed" \
            --edit-last \
            --create-if-none
  deploy:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact
          path: ${{ runner.temp }}/artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate PR Context & Setup Environment
        uses: actions/github-script@v9
        env:
          SITE_PATH: ${{ runner.temp }}/artifact/site
          PULL_REQUEST_NUMBER_PATH: ${{ runner.temp }}/artifact/PULL_REQUEST_NUMBER
        with:
          script: |
            const fs = require("fs");
            const prNumberPath = process.env.PULL_REQUEST_NUMBER_PATH;
            if (!prNumberPath || !fs.existsSync(prNumberPath) || !fs.statSync(prNumberPath).isFile()) {
              throw new Error("Pull request number file not found.");
            }
            const sitePath = process.env.SITE_PATH;
            if (!sitePath || !fs.existsSync(sitePath) || !fs.statSync(sitePath).isDirectory()) {
              throw new Error("Site dir not found.");
            }
            const PULL_REQUEST_NUMBER = parseInt(fs.readFileSync(prNumberPath, "utf8").trim(), 10);
            if (isNaN(PULL_REQUEST_NUMBER)) {
              throw new Error("Failed to parse the pull request number.");
            }
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: PULL_REQUEST_NUMBER });
            core.info(`Current PR state: ${pr.state}`);
            if (pr.state !== "open") {
              throw new Error("The pull request is not open.");
            }
            const run = context.payload.workflow_run;
            if (!run) {
              throw new Error("context.payload.workflow_run is undefined. Ensure this script runs on the 'workflow_run' event.");
            }
            if (pr.head.sha !== run.head_sha) {
              throw new Error("PR head SHA does not match the workflow run head SHA.");
            }
            if (pr.head.ref !== run.head_branch) {
              throw new Error("PR head branch does not match the workflow run head branch.");
            }
            if (pr.head.repo.full_name !== run.head_repository.full_name) {
              throw new Error("PR head repository fullname does not match the workflow run head repository fullname.");
            }
            core.exportVariable('PULL_REQUEST_NUMBER', PULL_REQUEST_NUMBER);
      - name: Deploy Preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: |
            pages deploy "${{ runner.temp }}/artifact/site" --project-name="${{ env.CLOUDFLARE_PAGES_PROJECT_NAME }}" --branch="pr${{ env.PULL_REQUEST_NUMBER }}" --no-bundle
      - name: Upsert Preview URL Comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ env.PULL_REQUEST_NUMBER }}" \
            --repo "${{ github.repository }}" \
            --body "Preview URL: https://pr${{ env.PULL_REQUEST_NUMBER }}.${{ env.CLOUDFLARE_PAGES_PROJECT_NAME }}.pages.dev" \
            --edit-last \
            --create-if-none
